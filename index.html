/* ===== Ghép trận ===== */
async function startMatch(){
 const id=++mt,ros=[{n:$("#nm").value.trim()||"Tân sinh viên",ch:pick,bot:0}],used=new Set([pick]),names=["Minh Anh","Bảo Ngọc","Quang Huy","Thu Hà","Đức Anh","Khánh Linh"];
 const draw=()=>{$("#slots").innerHTML=[0,1,2,3].map(i=>ros[i]?`<div class="slot f"><b>${CH[ros[i].ch][1]}</b><span>${ros[i].n}</span><small>${CH[ros[i].ch][0]}</small></div>`:`<div class="slot"><div class="spin"></div><span>Đang tìm đối thủ…</span></div>`).join("")};
 show("match");draw();$("#mst").textContent="Đang ghép trận… 1/4";
 while(ros.length<4){await sleep(900+R(900));if(id!=mt)return;let c;do c=R(8);while(used.has(c));used.add(c);ros.push({n:names.splice(R(names.length),1)[0],ch:c,bot:1});draw();$("#mst").textContent=`Đã có ${ros.length}/4 người chơi`}
 for(let k=3;k>0;k--){$("#mst").textContent=`Vào trận sau ${k}…`;await sleep(800);if(id!=mt)return}
 startGame(ros);
}

const COL=["#ff4d6d","#2d9cdb","#27ae60","#f2994a"];
function pos(i){return i<=10?[11,11-i]:i<=20?[21-i,1]:i<=30?[1,i-19]:[i-29,11]}
function side(i){return i%10==0?"c":i<10?"b":i<20?"l":i<30?"t":"r"}
function buildBoard(){
 document.querySelectorAll(".tile").forEach(t=>t.remove());$("#tok").innerHTML="";
 T.forEach((t,i)=>{const [r,c]=pos(i),d=document.createElement("div"),s=side(i),ty=t[1],price=ty=="p"?t[3]:(ty=="r"||ty=="u"||ty=="tax")?t[2]:null;
  d.className="tile "+(s=="c"?"c "+(i<10?"b":"t"):s);d.dataset.i=i;d.style.gridArea=`${r}/${c}`;
  d.innerHTML=(ty=="p"?`<i class="band" style="background:${C[t[2]]}"></i>`:"")+`<div class="body"><em>${IC[ty]}</em><span>${t[0]}</span>${price?`<small>${fmt(price)}</small>`:""}</div>`;
  $("#board").append(d)})}
function place(){const bd=$("#board");P.forEach((p,i)=>{let k=$("#tk"+i);if(!k){k=document.createElement("div");k.id="tk"+i;k.className="tk";k.textContent=CH[p.ch][1];k.style.borderColor=p.col;$("#tok").append(k)}
 const tl=bd.querySelector(`.tile[data-i="${p.pos}"]`),w=tl.offsetWidth,h=tl.offsetHeight;
 k.style.left=tl.offsetLeft+w/2+[-.22,.22,-.22,.22][i]*w+"px";k.style.top=tl.offsetTop+h/2+[-.2,-.2,.2,.2][i]*h+"px";k.style.display=p.out?"none":""})}
addEventListener("resize",()=>P.length&&place());
function panel(){$("#pl").innerHTML=P.map((p,i)=>`<div class="pc${i==cur?" on":""}${p.out?" out":""}" style="--c:${p.col}"><b>${CH[p.ch][1]}</b><div><strong>${p.n}${p.bot?"":" (bạn)"}</strong><small>${fmt(p.money)} · ${Object.values(own).filter(o=>o==i).length} ô</small></div></div>`).join("");
 document.querySelectorAll(".tile").forEach(t=>{const o=own[t.dataset.i];t.style.boxShadow=o==null?"":`inset 0 0 0 .4cqw ${P[o].col}`})}
function startGame(ros){const g=++gid;P=ros.map((r,i)=>({...r,id:i,money:1500,pos:0,jail:0,out:0,col:COL[i]}));own={};cur=0;run=true;show("game");buildBoard();place();panel();$("#log").innerHTML="";log("🎓 Chào mừng đến Không Nghề Thì Nghiệp! Mua trường, thu “học phí” và trả lời câu hỏi luật lao động.");loop(g)}

async function loop(g){
 try{while(run&&g==gid){panel();const p=P[cur];if(!p.out)await turn(p);
  const alive=P.filter(x=>!x.out);if(alive.length==1){run=false;await ask(`<h2>🏆 ${alive[0].n} chiến thắng!</h2><p>Mọi đối thủ đã phá sản.</p>`,["Về sảnh"]);show("lobby");return}
  cur=(cur+1)%4}}catch(e){}}

async function dice(){const a=1+R(6),b=1+R(6);["#d1","#d2"].forEach(s=>{const e=$(s);e.classList.remove("drop");void e.offsetWidth;e.classList.add("drop")});
 const iv=setInterval(()=>{$("#d1").textContent=F[R(6)];$("#d2").textContent=F[R(6)]},80);
 try{await sl(800)}finally{clearInterval(iv)}
 $("#d1").textContent=F[a-1];$("#d2").textContent=F[b-1];await sl(300);return[a,b]}

async function turn(p){
 $("#st").textContent=p.bot?`${p.n} đang chơi…`:"Đến lượt bạn!";
 if(p.jail){p.jail=0;log(`🚔 ${p.n} bị phòng HR giữ lại, mất lượt.`);await sl(900);return}
 const btn=$("#roll");
 if(!p.bot){btn.disabled=false;await new Promise(r=>btn.onclick=r);btn.disabled=true}else await sl(900);
 const [a,b]=await dice();log(`🎲 ${p.n} đã tung được ${a+b}`);
 for(let k=0;k<a+b;k++){p.pos=(p.pos+1)%40;if(p.pos==0){p.money+=200;log(`🎓 ${p.n} qua Xuất phát, nhận học bổng 200tr`)}place();await sl(210)}
 await land(p);
 if(p.money<0){p.out=1;Object.keys(own).forEach(k=>own[k]==p.id&&delete own[k]);log(`💥 ${p.n} phá sản!`);place()}
 panel();await sl(500)}

async function land(p){const i=p.pos,t=T[i],ty=t[1];
 if(ty=="p"||ty=="r"||ty=="u"){const price=ty=="p"?t[3]:t[2],o=own[i];
  if(o==null){let buy=false;
   if(p.bot)buy=p.money>price+250&&R(10)>2;
   else if(p.money>=price)buy=(await ask(`<h3>${IC[ty]} ${t[0]}</h3><p>Giá <b>${fmt(price)}</b> · bạn có ${fmt(p.money)}.<br>Mua ô này để thu “học phí”?</p>`,["Mua","Bỏ qua"]))==0;
   if(buy){p.money-=price;own[i]=p.id;log(`🏫 ${p.n} mua ${t[0]} (${fmt(price)})`)}}
  else if(o!=p.id){const rent=Math.round(price*(ty=="p"?.12:.15));p.money-=rent;P[o].money+=rent;log(`💸 ${p.n} trả ${fmt(rent)} cho ${P[o].n} (${t[0]})`)}}
 else if(ty=="chance"||ty=="chest")await quiz(p);
 else if(ty=="tax"){p.money-=t[2];log(`💸 ${p.n} nộp ${t[0]}: ${fmt(t[2])}`)}
 else if(ty=="gojail"){p.pos=10;p.jail=1;place();log(`🚔 ${p.n} bị gọi vào phòng HR: “thử việc không lương”!`)}
 else if(ty=="park")log(`🍜 ${p.n} nghỉ ở căng-tin.`);
 panel()}

async function quiz(p){const q=Q[R(Q.length)];let ok;
 if(p.bot)ok=R(10)<6;
 else ok=(await ask(`<h3>⚖️ Thẻ kiến thức pháp luật</h3><p>${q.q}</p>`,q.a))==q.c;
 p.money+=ok?100:-50;log(`${ok?"✅":"❌"} ${p.n} ${ok?"trả lời đúng +100tr":"trả lời sai −50tr"}`);
 if(!p.bot)await ask(`<h3>${ok?"✅ Chính xác! +100tr":"❌ Chưa đúng −50tr"}</h3><p><b>Đáp án:</b> ${q.a[q.c]}</p><p>${q.e}</p>`,["Tiếp tục"])}
</script>

$("#how").onclick=()=>ask(`<h2>📖 Cách chơi (theo tài liệu Team 8)</h2><p>• Bàn cờ bố trí như Monopoly. Cụm 1 = Dễ (các ô đầu), cụm 2 = Trung bình, cụm 3 = Khó (các ô cuối).<br>• Vốn 15.000k. Qua hoặc dừng ở Bắt đầu học kỳ: +2.000k.<br>• Vào ô Cơ hội, Khí vận hay ô việc: bộ bài hiện lên, chạm hoặc kéo thẻ để rút. Thẻ việc là câu hỏi, trả lời ngay trên thẻ.<br>• Ô việc vô chủ: đúng nhận việc và lương (+500k / +1.000k / +2.000k), sai sập bẫy (−3.000k / −1.500k / −750k).<br>• Ô có chủ: trả phí, rồi có thể mua lại bằng cách trả lời (đúng giảm 10% / 25% / 50%, sai trả 100%).<br>• Hiểu lầm: vào thẳng Trụ sở Đa cấp, mất 3 lượt; thoát bằng 1.000k hoặc thẻ Bảo lãnh.<br>• Cạn tiền: bán việc cho Ngân hàng; hết việc mà vẫn nợ thì bị loại. Chạm 100.000k là tỷ phú.</p>`,["Đã hiểu"]);
/* ---- Bộ bài ---- */
const DKD={chance:{ic:"🎲",nm:"CƠ HỘI",c:"#8e44ad"},chest:{ic:"🍀",nm:"KHÍ VẬN",c:"#1fa463"},q:[0,"#2fa84f","#d9a900","#e03b3b"]};
function burst(good){const bd=$("#board");for(let i=0;i<12;i++){const e=document.createElement("span");e.className="dk-fx";e.textContent=good?"💰":"💸";e.style.setProperty("--x",(R(70)-35)+"cqw");e.style.setProperty("--y",(good?-(10+R(25)):(10+R(25)))+"cqw");e.style.animationDelay=R(300)+"ms";bd.append(e);setTimeout(()=>e.remove(),2000)}}
async function pay(p,d,l1){burst(d>=0);fxText(p,l1,d=="bl"?"🎫 Thẻ Bảo lãnh":(d>0?"+":"")+K(d),d=="bl"?"#6aa8ff":d>0?CG:d<0?CR:CY);await sl(1700)}
async function deckRun(p,kind,L,opt){
 const th=kind=="q"?{ic:"⚖️",nm:"TÌNH HUỐNG PHÁP LÝ · "+LVN[L].toUpperCase(),c:DKD.q[L]}:DKD[kind],human=!p.bot,bd=$("#board"),old=$("#deck");if(old)old.remove();
 const d=document.createElement("div");d.id="deck";d.style.setProperty("--dc",th.c);
 d.innerHTML=`<div class="dk-t">${CH[p.ch][1]} ${human?"Bạn":p.n} rút thẻ</div><div class="dk-st"><i class="dk-c c3"></i><i class="dk-c c2"></i><button class="dk-c top" aria-label="Rút thẻ ${th.nm}"><b>${th.ic}</b><span>${th.nm}</span></button></div><div class="dk-h">${human?(matchMedia("(pointer:coarse)").matches?"Chạm hoặc vuốt thẻ để rút":"Nhấp hoặc kéo thẻ để rút"):"👀 "+p.n+" đang rút thẻ…"}</div>`;
 bd.append(d);const top=d.querySelector(".top");
 await new Promise(r=>{if(!human){setTimeout(r,1400);return}
  let x0=null,y0=0,dx=0,dy=0,done=false;const go=()=>{if(!done){done=true;r()}};
  top.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;top.setPointerCapture(e.pointerId);top.style.animation="none"};
  top.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;dy=e.clientY-y0;top.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`};
  top.onpointerup=()=>{if(x0==null)return;const m=Math.hypot(dx,dy);x0=null;dx=dy=0;if(m<10||m>45)go();else{top.style.transform="";top.style.animation=""}};
  top.onpointercancel=()=>{x0=null;top.style.transform="";top.style.animation=""};
  top.onclick=e=>{if(e.detail===0)go()}});
 d.querySelector(".dk-st").remove();d.querySelector(".dk-h").remove();
 const f=document.createElement("div");f.className="dk-f";let out;
 const hold=lb=>human?new Promise(r=>{const b=document.createElement("button");b.className="btn";b.textContent=lb;b.onclick=r;f.append(b);b.focus()}):sl(2800);
 if(kind=="q"){const q=pickQ(L);
  f.innerHTML=`<h4>${th.ic} ${th.nm}</h4><div class="dk-b"><i></i></div><p><b>${opt.sub}</b></p><p>${q.q}</p><div class="dk-o">${q.a.map((a,i)=>`<button data-i="${i}"${human?"":" disabled"}>${"ABCD"[i]}. ${a}</button>`).join("")}</div><p class="dk-x"></p>`;d.append(f);
  const bs=[...f.querySelectorAll(".dk-o button")],bar=f.querySelector(".dk-b i");
  const pick=await new Promise(r=>{let done=false,iv;const fin=i=>{if(!done){done=true;clearInterval(iv);r(i)}},t0=performance.now();
   iv=setInterval(()=>{const e=performance.now()-t0;bar.style.width=Math.max(0,100-e/200)+"%";if(e>=20000)fin(-1)},100);
   if(human)bs.forEach(b=>b.onclick=()=>fin(+b.dataset.i));else setTimeout(()=>fin(R(10)<(L==1?8:L==2?6:4)?q.c:(q.c+1+R(q.a.length-1))%q.a.length),2500+R(3000))});
  out=pick==q.c;bs.forEach((b,i)=>{b.disabled=true;b.classList.toggle("ok",i==q.c);if(i==pick){b.classList.add("pick");if(!out)b.classList.add("bad")}});
  f.querySelector(".dk-x").innerHTML=`<b>${pick<0?"⌛ Hết giờ.":out?"✅ Chính xác!":"❌ Chưa đúng."}</b> ${q.e}`;await hold("Tiếp tục")}
 else{const c=opt.c,bl=c[1]=="bl";
  f.innerHTML=`<h4>${th.ic} ${th.nm}</h4><p style="font-size:4.8cqw"><b>${c[0]}</b></p><p style="font-size:8cqw;font-weight:900;text-align:center;color:${bl?"#2457c5":c[1]>0?"#1fa463":"#e03b3b"}">${bl?"🎫 Bảo lãnh":(c[1]>0?"+":"")+K(c[1])}</p>`;d.append(f);await hold("Nhận")}
 d.classList.add("out");await sl(380);d.remove();return out}
async function jobTile(p,i,t){const L=CL[t[2]],[rw,pn,fee,pr]=RW[L],o=own[i],dc=DISC[L],min=Math.round(pr*(1-dc));
 if(o==null){log(`💼 ${p.n} vào ô ${t[0]} (${LVN[L]}), rút thẻ Tình huống pháp lý`);
  if(await deckRun(p,"q",L,{sub:`${t[0]} · đúng +${K(rw)} / sai −${K(pn)}`})){own[i]=p.id;p.money+=rw;log(`✅ ${p.n} đúng, nhận việc ${t[0]}, lương +${K(rw)}`);panel();await pay(p,rw,"nhận việc, lương")}
  else{p.money-=pn;log(`❌ ${p.n} sai, sập bẫy lừa đảo −${K(pn)}`);panel();await pay(p,-pn,"sập bẫy lừa đảo")}}
 else if(o!=p.id){p.money-=fee;P[o].money+=fee;log(`🤝 ${p.n} trả phí ${K(fee)} cho ${P[o].n} (${t[0]})`);panel();await pay(p,-fee,`trả phí cho ${P[o].n}`);
  if(p.money<min)return;
  const want=p.bot?(p.money>pr+3000&&R(10)<4):((await ask(`<h3>🔁 Mua lại “${t[0]}”?</h3><p>Giá ${K(pr)}. Trả lời đúng được giảm ${dc*100}% (còn ${K(min)}), trả lời sai phải trả 100%.</p>`,["Mua lại","Bỏ qua"]))==0);
  if(!want)return;
  const ok=await deckRun(p,"q",L,{sub:`Mua lại ${t[0]} · đúng giảm ${dc*100}% / sai trả 100%`}),c=ok?min:pr;
  if(p.money<c){log(`${p.n} ${ok?"đúng":"sai"} nhưng không đủ ${K(c)} để mua`);return}
  p.money-=c;P[o].money+=c;own[i]=p.id;log(`🔁 ${p.n} mua lại ${t[0]} giá ${K(c)} (${ok?"đúng, được giảm":"sai, trả 100%"})`);panel();await pay(p,-c,"mua lại việc")}
 else log(`🏢 ${p.n} về ô việc của mình (${t[0]})`)}
async function land(p){const i=p.pos,t=T[i],ty=t[1];
 if(ty=="p")await jobTile(p,i,t);
 else if(ty=="chance"||ty=="chest"){const ch=ty=="chance",c=(ch?CO:KV)[R(6)],bl=c[1]=="bl";
  await deckRun(p,ty,0,{c});if(bl)p.bl=(p.bl||0)+1;else p.money+=c[1];
  log(`${ch?"🎲":"🍀"} ${p.n}: ${c[0]} (${bl?"+thẻ Bảo lãnh":(c[1]>0?"+":"")+K(c[1])})`);panel();await pay(p,bl?"bl":c[1],c[0])}
 else if(ty=="gojail"){p.pos=10;p.jail=3;place();log(`😵 ${p.n} bị hiểu lầm là thành viên công ty lừa đảo → thẳng tới Trụ sở Đa cấp, không nhận trợ cấp`)}
 else if(ty=="jail")log(`👀 ${p.n} chỉ ghé tham quan Trụ sở Đa cấp, không bị phạt`);
 else if(ty=="park")log(`🏡 ${p.n} về quê nghỉ ngơi, an toàn tuyệt đối`);
 panel()}
const ot2=turn;turn=async function(p){
 if(p.jail>0){let c;
  if(p.bot)c=p.bl?"bl":p.money>6000?"pay":"stay";
  else{const o=[],m=[];if(p.bl){o.push("Dùng thẻ Bảo lãnh");m.push("bl")}if(p.money>=1000){o.push("Nộp tiền chuộc 1.000k");m.push("pay")}o.push("Ở lại (mất lượt)");m.push("stay");
   $("#qp").hidden=true;c=m[await ask(`<h3>🚔 Bạn đang ở Trụ sở Đa cấp</h3><p>Còn ${p.jail} lượt bị giữ. Thoát ngay bằng 1.000k tiền chuộc hoặc thẻ Bảo lãnh.</p>`,o)]}
  if(c=="bl"){p.bl--;p.jail=0;log(`🎫 ${p.n} dùng thẻ Bảo lãnh, thoát ngay`)}
  else if(c=="pay"){p.money-=1000;p.jail=0;log(`💸 ${p.n} nộp 1.000k tiền chuộc, thoát ngay`)}
  else{p.jail--;log(`🚔 ${p.n} bị giữ, còn ${p.jail} lượt.`);panel();await sl(900);return}
  panel()}
 return ot2(p)};
const osg=startGame;startGame=function(r){const d=$("#deck");if(d)d.remove();return osg(r)};
async function finish(why,w){if(over)return;over=true;run=false;gid++;clearInterval(hv);
 $("#modal").classList.remove("on");$("#xc").classList.remove("on");$("#qp").hidden=true;["#mq","#dn","#mn","#deck"].forEach(x=>{const e=$(x);if(e)x=="#deck"?e.remove():e.style.display="none"});
 const ws=p=>p.money+Object.keys(own).filter(k=>own[k]==p.id).reduce((s,k)=>s+RW[CL[T[k][2]]][3],0);
 const rk=[...P].sort((a,b)=>(a.out-b.out)||ws(b)-ws(a));rk.forEach(p=>{if(!p.out)p.money=ws(p)});
 podium(rk,why=="time"?"⏰ Hết giờ! Xếp hạng theo tài sản":why=="money"?`🎯 ${w.n} đạt ${K(GOAL)} – tỷ phú việc làm!`:"🏁 Chỉ còn một người trên bàn cờ!")}
</script></body></html>
